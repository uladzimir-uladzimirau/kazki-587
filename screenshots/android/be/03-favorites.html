<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap&subset=cyrillic');
html,body{margin:0;padding:0;}
#canvas{position:relative;width:1080px;height:1920px;overflow:hidden;background:#C8372D;}
.bg{position:absolute;inset:0;background-image:url('../../backgrounds/android-favorites.png');background-size:cover;background-position:center;}
.scrim{position:absolute;left:0;top:0;width:100%;height:30%;background:radial-gradient(ellipse 70% 80% at 50% 45%, rgba(90,14,14,.45) 0%, rgba(90,14,14,0) 75%);}
h1{margin:0;font-family:'Lora',serif;font-weight:700;font-size:120px;line-height:1.08;color:#FBF6EC;letter-spacing:-0.5px;text-shadow:0 4px 18px rgba(40,6,6,.55),0 2px 4px rgba(40,6,6,.4);}
</style>
</head>
<body>
<div id="canvas">
  <div class="bg"></div>
  <div class="scrim"></div>
  <div style="position:absolute; top:0%; left:50%; width:84%; height:22%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; text-align:center;">
    <h1>Любімыя<br>казкі побач</h1>
  </div>
  <div style="position:absolute; left:50%; top:22%; width:61.5%; transform:translateX(-50%);">
    <!-- Android phone mockup -->
    <div aria-label="Android phone" style="position:relative; aspect-ratio:1080/2344; background:#111318; border:3px solid #343840; border-radius:6% / 2.7%; box-shadow:0 28px 70px rgba(0,0,0,.35);">
      <div style="position:absolute; overflow:hidden; left:2.25%; top:1.1%; width:95.5%; height:97.8%; border-radius:5.5% / 2.5%; background:#000;">
        <img src="../../captures/android/03-favorites.png" style="display:block; width:100%; height:100%; object-fit:contain; object-position:center;" draggable="false" />
      </div>
    </div>
  </div>
</div>
</body>
</html>
